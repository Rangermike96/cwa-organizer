# CWA Organizer configuration.
#
# Copy this file to config.toml in the project folder (or run
# `./cwa-organizer init`) and edit that copy. Any key you leave out falls back
# to the value shown here, so your config.toml only needs the lines you change.
# Your Hardcover API key goes in secrets.toml, never in this file.

[library]
# Path to the Calibre library folder (the one that contains metadata.db).
path = "/mnt/Media_Share/Books/Calibre Library"

[safety]
# URL of the CWA web UI. Before any run that writes, the organizer tries to
# connect here and refuses to write if CWA answers. Leave empty to skip this
# check; you will then be asked to confirm that CWA is stopped.
cwa_url = ""
# Local processes that must not be running during a write (matched against
# the command line, case-insensitive).
blocked_processes = ["calibre", "calibre-server", "calibredb", "calibremcp", "calibre-mcp", "calibre-parallel"]
# Refuse to write when metadata.db-wal is not empty (a sign another program
# still has the database open, or CWA did not shut down cleanly).
refuse_if_wal_not_empty = true
# How many metadata.db backups to keep in backups/.
backup_keep = 20

[calibre]
# Commands from the calibre package on this computer.
calibre_debug = "calibre-debug"
fetch_ebook_metadata = "fetch-ebook-metadata"
ebook_meta = "ebook-meta"
# How many books to write per batch during the long online passes.
flush_every = 25
# Largest number of books handed to one calibre process. Smaller chunks mean
# less to retry if calibre crashes, and a Ctrl+C stops sooner.
write_chunk = 500

[columns]
# Custom columns created (if missing) the first time a run writes.
booktype = "booktype"            # shown in calibre/CWA as "Book Type"
status = "metadata_status"       # shown as "Metadata Status"

[labels]
light_novel = "Light Novel"
manga = "Manga"
other = "Other Books"
fetched = "Metadata-Fetched"
failed = "Metadata-Fetch-Failed"
# Keep the booktype and status tags in sync with the custom columns.
mirror_to_tags = true

[titles]
# Rewrite recognised volume titles to one style: "Series, Vol. 3: Subtitle".
standardize = true
vol_label = "Vol."
# Remove "(Light Novel)", "(Manga)", "(Novel)" from titles once they have
# been recorded as classification hints.
strip_edition_markers = true
# "Vol. 2 Part 3" becomes series index 2.3. Set to "skip" to leave such
# books without a series index (they are then only reported).
part_index_style = "decimal"
# Extra words that mark a [bracket] or (paren) group in a title as release junk.
bracket_junk_words = ["scan", "ocr", "kindle", "kobo", "webnovel", "retail", "digital", "compressed", "epub", "calibre", "converted", "steam", "lnwncentral", "dale", "zaphkiel"]

[series]
# Minimum series-name length for matching.
min_series_name_len = 4
# A bare trailing number ("Series Name 4") is only treated as a volume when at
# least this many books share the same series name with different numbers.
bare_number_min_siblings = 2
# Series names never auto-assigned from titles.
blocklist = ["another", "untitled", "complete"]
# If a book already has a series and the title disagrees, only report it.
fix_existing_index = false

[authors]
# Names that are never real authors. Books with these are treated like
# filename-junk authors and looked up.
junk_names = ["admin", "unknown", "unknown author", "verypdf", "jpg to pdf converter", "calibre", "adobe acrobat", "microsoft word", "seven seas", "quantum ln", "various"]
# Auto-flip "Last, First" to "First Last" only when "First Last" already
# exists in the library. Other flips are only suggested.
flip_only_when_counterpart_exists = true
# Minimum similarity (0-1) for an author spelling variant to be suggested.
suggest_similarity = 0.88

[publishers]
# Substring lists (case-insensitive) used as classification hints.
light_novel = ["j-novel club", "j-novel heart", "yen on", "cross infinite world", "hanashi media", "tentai books", "sol press", "airship", "star fruit books", "hobby japan", "wuxiaworld", "oppatranslations", "via lactea", "vialactea", "inori books", "meteor strike", "editio publishing", "mullebooks", "muellebooks", "peach flower house", "bento books", "breakthrough bandwagon", "regin's chronicles", "haikasoru", "haika soru", "j-novel", "labyrinth books", "kaiten books"]
manga = ["tokyopop", "digital manga", "udon entertainment", "dark horse manga", "kodansha comics", "square enix manga", "del rey manga", "ghost ship", "june", "dokidoki", "drmaster", "dr. master", "kitsune books", "yen press manga"]
# Publish both light novels and manga: never decisive on their own.
mixed = ["seven seas", "yen press", "kodansha", "vertical", "square enix", "one peace", "denpa", "ize press", "jy", "viz", "kadokawa", "shueisha", "dark horse", "del rey", "tuttle", "stone bridge"]
# General fiction publishers: count toward "Other Books".
general = ["orbit", "penguin", "harpercollins", "random house", "tor", "tor books", "aethon", "scholastic", "knopf", "little, brown", "dover", "new directions", "alma books", "henry holt", "simon & schuster", "macmillan", "hachette", "bantam", "ballantine", "gollancz", "voyager", "baen", "daw", "ace books", "podium", "windmill books"]

[tags]
# Split BISAC-style tags "Fiction / Fantasy / General" into their parts.
split_bisac = true
# Tags removed everywhere (case-insensitive exact match).
junk = ["-", "new subject", "general", "ebook", "e-book", "story", "fiction / general"]
# Also drop a tag that is just one of the book's own author names.
drop_author_name_tags = true
# Tags never copied across a series by the tag backfill (case-insensitive).
never_propagate = ["manga", "light novel", "other books", "graphic novel", "comics & graphic novels", "comic strips & cartoons", "east asian style", "general", "to-read", "read", "reading", "favorite", "favourite", "premium", "premium edition", "official translation", "metadata-fetched", "metadata-fetch-failed"]

[tags.synonyms]
# "variant" = "Canonical" (matching is case-insensitive).
"light novel" = "Light Novel"
"light novels" = "Light Novel"
"ln" = "Light Novel"
"manga" = "Manga"
"ficion" = "Fiction"
"sci-fi" = "Science Fiction"
"scifi" = "Science Fiction"
"science-fiction" = "Science Fiction"
"soft sci-fi" = "Soft Science Fiction"
"young adult fiction" = "Young Adult"
"ya" = "Young Adult"
"lgbtq+" = "LGBTQ+"
"international crime & mystery" = "International Mystery & Crime"
"thrillers" = "Thriller"
"humour" = "Humor"
"comics & graphic novels" = "Comics & Graphic Novels"
"action & adventure - general" = "Action & Adventure"

[publishers.aliases]
# "variant" = "Canonical". Variants that differ only in case, spacing,
# punctuation or a corporate suffix (", LLC", " Inc.") are merged automatically.
"Seven Seas" = "Seven Seas Entertainment"
"Seven Seas Entertainment, LLC" = "Seven Seas Entertainment"
"VIZMedia" = "VIZ Media"
"VIZ Media, LLC" = "VIZ Media"
"VIZ Media LLC" = "VIZ Media"
"Haika Soru" = "Haikasoru"
"Muellebooks" = "Mullebooks"
"Digital Manga Inc." = "Digital Manga Publishing"
"Via Lactea Ltd." = "Via Lactea Press"
"ViaLactea_Ltd" = "Via Lactea Press"
"Kodansha comics" = "Kodansha Comics"
"One Peace Ebooks" = "One Peace Books"
"Yen Press, LLC" = "Yen Press"
"Dover Publications, Inc" = "Dover Publications"
"Square Enix, Inc." = "Square Enix"
"WuxiaWorld LTD" = "Wuxiaworld Publishing USA Ltd"

[fetch]
# calibre metadata sources. Amazon is left out because it blocks bulk requests.
plugins = ["Google", "Open Library", "Edelweiss"]
# Only look up books missing at least one of these fields.
only_incomplete = true
required_fields = ["comments", "publisher", "pubdate"]
max_title_variants = 4
timeout_seconds = 45
sleep_base = 8
sleep_jitter = 4
# Retries for source errors (HTTP 429 and friends). The budget is per book, not
# per title phrasing, so one rate-limited book cannot cost several minutes.
max_retries = 2
retry_backoff_base = 15
retry_backoff_cap = 60
# Minimum seconds between provider requests. Doubled (up to max_request_gap)
# whenever a source rate-limits us, halved again after a clean answer.
min_request_gap = 3
max_request_gap = 45
# Try Hardcover when Google / Open Library / Edelweiss have nothing acceptable.
# Needs a Hardcover API key in secrets.toml. It carries individual light novel
# volumes the other sources often list only as omnibus or manga editions.
hardcover_fallback = true
empty_streak_threshold = 8
cooldown_seconds = 900
# Minimum similarity between our title and the provider's title.
min_title_similarity = 0.80
# Minimum similarity between our author and the provider's author.
min_author_similarity = 0.75

[mangaupdates]
enabled = true
min_interval_seconds = 1.5
cache_days = 60
# Minimum similarity for a MangaUpdates title to count as the same series.
min_similarity = 0.93

[hardcover]
enabled = true
min_interval_seconds = 1.2
cache_days = 60
min_similarity = 0.92

[files]
# "fast" checks existence and headers; "deep" also verifies every zip CRC
# (slow over NFS). The --deep-file-check flag switches to deep for one run.
check_level = "fast"
